version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: magicled_postgres
    restart: always
    environment:
      POSTGRES_USER: magicled_user
      POSTGRES_PASSWORD: magicled_pass
      POSTGRES_DB: magicled_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: